<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ оформлен</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="text-align: center; padding-top: 50px;">
    <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</button>

    <div style="max-width: 600px; margin: 0 auto; background: var(--filter-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 8px;">
        <h1 style="color: #27ae60;">🎉 Спасибо за заказ, {{ customer_name }}!</h1>
        <p style="font-size: 18px; margin: 20px 0;">Ваш заказ успешно оформлен. Складские остатки обновлены, а информация передана администратору.</p>
        <br>
        <a href="/catalog" class="btn-buy" style="padding: 12px 30px; text-decoration: none; display: inline-block;">Вернуться в каталог</a>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>
</body>
</html>
